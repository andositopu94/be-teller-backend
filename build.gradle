buildscript {
    ext {
        springBootVersion = '1.5.4.RELEASE'
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
    }
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'org.springframework.boot'


version = '0.0.1-SNAPSHOT'
sourceCompatibility = 1.7

repositories {
    mavenCentral()
    mavenLocal()
    jcenter()
    maven { url "http://jasperreports.sourceforge.net/maven2/" }
    maven { url "http://jaspersoft.artifactoryonline.com/jaspersoft/third-party-ce-artifacts/" }
    maven { url "http://jaspersoft.artifactoryonline.com/jaspersoft/jr-ce-releases" }
    maven { url "https://code.lds.org/nexus/content/groups/main-repo" }
    maven { url "http://central.maven.org/maven2/" }
}

dependencies {
    compile("org.springframework.boot:spring-boot-starter-web") {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    compile("org.springframework.boot:spring-boot-starter-data-jpa") {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    compile("org.springframework.boot:spring-boot-starter-security") {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    compile("org.springframework.boot:spring-boot-devtools")
    //compile("mysql:mysql-connector-java")
    compile('org.springframework.boot:spring-boot-starter-log4j2')
    compile("io.jsonwebtoken:jjwt:0.7.0")
    compile("org.apache.commons:commons-lang3:3.7")
    compile("commons-codec:commons-codec:1.11")
    compileOnly("org.projectlombok:lombok")
    compile("com.itextpdf:itextpdf:5.5.12")
    compile("com.google.guava:guava:19.0")
        compile(group: 'commons-beanutils', name: 'commons-beanutils', version: '1.9.3')
    compile('org.jpos:jpos:2.0.2')
    compile("org.hibernate:hibernate-validator")
    compile('org.springframework.boot:spring-boot-starter-mail')
    compile('org.springframework.boot:spring-boot-starter-freemarker')
    compile("org.springframework:spring-context-support")
    compile("com.lowagie:itext:2.1.7")
    compile('org.olap4j:olap4j:1.2.0')
    compile("net.sf.jasperreports:jasperreports:6.3.1")
    compile('net.sf.jasperreports:jasperreports-fonts:6.0.0')
    compile(group: 'com.google.zxing', name: 'core', version: '2.2')
    compile(group: 'com.google.zxing', name: 'javase', version: '2.2')
//    compile(group: 'mysql', name: 'mysql-connector-java')
//    compile("net.sf.jasperreports:jasperreports-functions:6.3.1")
    compile group: 'joda-time', name: 'joda-time', version: '2.9.9'
    compile files('libs/ojdbc7.jar')
    // compile(group: 'com.oracle', name: 'ojdbc6', version: '11.2.0.3')
	compile group: 'net.sourceforge.dynamicreports', name: 'dynamicreports-core', version: '5.1.0'
	compile group: 'net.sourceforge.dynamicreports', name: 'dynamicreports-adhoc', version: '5.1.0'
	compile group: 'org.hibernate', name: 'hibernate-envers', version: '5.0.12.Final'
    compile 'org.apache.poi:poi:3.10.1'
    compile 'org.apache.httpcomponents:httpclient:4.5.13'

}
configurations {
    compile.exclude group: 'ch.qos.logback'
} 